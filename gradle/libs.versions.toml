coroutines = "1.10.2"
serialization = "1.9.0"
junit = "4.13.2"
benchmark = "1.4.1"
profileinstaller = "1.4.1"
junitExt = "1.3.0"
uiautomator = "2.3.0"
composeMultiplatform = "1.9.3"
jna = "5.17.0"

[libraries]
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
