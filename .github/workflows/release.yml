name: Android release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install native build tools
        run: |
          cargo install cargo-ndk --locked
          sdkmanager 'ndk;27.2.12479018'

      - name: Fetch native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-natives.sh

      - name: Build TRACC native library
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018" ./scripts/build-rust.sh

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TRACC_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tracc-release.keystore"

      - name: Test and build APKs
        env:
          TRACC_KEYSTORE: ${{ runner.temp }}/tracc-release.keystore
          TRACC_KEYSTORE_PASSWORD: ${{ secrets.TRACC_KEYSTORE_PASSWORD }}
          TRACC_KEY_ALIAS: ${{ secrets.TRACC_KEY_ALIAS }}
          TRACC_KEY_PASSWORD: ${{ secrets.TRACC_KEY_PASSWORD }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./gradlew :shared:allTests :app:testDebugUnitTest :app:assembleRelease \
            -PtraccVersion="$VERSION" -PtraccUpdateRepo="$GITHUB_REPOSITORY"

      - name: Prepare release files
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a x86_64 x86 universal; do
            cp "app/build/outputs/apk/release/app-${ABI}-release.apk" "dist/TRACC-${VERSION}-${ABI}.apk"
          done
          python3 scripts/make-update-json.py "$VERSION" dist "$GITHUB_REPOSITORY"
          git archive --format=zip --prefix="TRACC-${VERSION}/" -o "dist/TRACC-${VERSION}-source.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
